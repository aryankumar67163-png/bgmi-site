<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#07101a;color:white;font-family:Arial;padding:20px}
h1{color:#ff8a00}
table{width:100%;border-collapse:collapse;background:#0c1724}
th,td{border:1px solid #2b3b4c;padding:10px;font-size:14px}
th{color:#ff8a00}
.btn{padding:8px 12px;color:white;text-decoration:none;border-radius:5px;background:#ff8a00}
.delete{background:red}
</style>
</head>
<body>

<h1>ADMIN PANEL</h1>
<a class="btn" href="/">Back</a>
<a class="btn" href="/logout">Logout</a>

<br><br>

<table>
<tr>
<th>Name</th>
<th>UID</th>
<th>Phone</th>
<th>Mode</th>
<th>Payment Ref</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for p in players %}
<tr>
<td>{{ p.name }}</td>
<td>{{ p.uid }}</td>
<td>{{ p.phone }}</td>
<td>{{ p.mode }}</td>
<td>{{ p.payment_ref }}</td>
<td>{{ p.paid }}</td>
<td>
<a class="btn" href="/mark_paid/{{ p.id }}">Mark Paid</a>
<a class="btn delete" href="/delete/{{ p.id }}" onclick="return confirm('Delete this entry?')">Delete</a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
